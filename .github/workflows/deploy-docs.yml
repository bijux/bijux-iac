    "steps":
      - "name": "Validate publication event and ref"
        "shell": "bash"
        "env":
          "PUBLICATION_EVENT": "${{ github.event_name }}"
          "PUBLICATION_REF": "${{ github.ref }}"
        "run": "set -euo pipefail\nif [[ \"$PUBLICATION_EVENT\" != \"workflow_dispatch\" || \"$PUBLICATION_REF\" != \"refs/heads/main\" ]]; then\n  echo \"Docs publication requires workflow_dispatch on refs/heads/main\" >&2\n  exit 1\nfi\n"
      - "name": "Checkout repository"
