      - "name": "Admit accepted documentation standards"
        "shell": "bash"
        "run": "set -euo pipefail\naccepted_ref=\"$(cat .github/standards/bijux-docs.sha)\"\nif [[ \"${#accepted_ref}\" != 40 || \"$accepted_ref\" == *[!0-9a-f]* ]]; then\n  echo \"Documentation standards require a full lowercase commit SHA\" >&2\n  exit 1\nfi\nsource_root=\"$PWD/artifacts/accepted-standard\"\nmkdir -p \"$source_root\"\ngit -C \"$source_root\" init --quiet\ngit -C \"$source_root\" remote add origin https://github.com/bijux/bijux-std.git\ngit -C \"$source_root\" fetch --quiet --depth 1 origin \"$accepted_ref\"\ngit -C \"$source_root\" checkout --quiet --detach FETCH_HEAD\nif [[ \"$(git -C \"$source_root\" rev-parse HEAD)\" != \"$accepted_ref\" ]]; then\n  echo \"Fetched documentation standards do not match the accepted pin\" >&2\n  exit 1\nfi\nprintf 'BIJUX_STD_ROOT=%s\\n' \"$source_root\" >> \"$GITHUB_ENV\"\nprintf 'BIJUX_STD_REF=%s\\n' \"$accepted_ref\" >> \"$GITHUB_ENV\"\n"
      - "name": "Resolve docs deploy configuration"
        "id": "config"
        "shell": "bash"
        "env":
          "VARS_DOCS_SITE_URL": "${{ vars.BIJUX_DOCS_SITE_URL }}"
          "VARS_DOCS_SITE_DIR": "${{ vars.BIJUX_DOCS_SITE_DIR }}"
          "VARS_DOCS_INSTALL_COMMAND": "${{ vars.BIJUX_DOCS_INSTALL_COMMAND }}"
          "VARS_DOCS_BUILD_COMMAND": "${{ vars.BIJUX_DOCS_BUILD_COMMAND }}"
          "VARS_DOCS_VERIFY_COMMAND": "${{ vars.BIJUX_DOCS_VERIFY_COMMAND }}"
          "VARS_DOCS_PYTHON_VERSION": "${{ vars.BIJUX_DOCS_PYTHON_VERSION }}"
          "VARS_DOCS_NODE_VERSION": "${{ vars.BIJUX_DOCS_NODE_VERSION }}"
          "VARS_DOCS_RUST_TOOLCHAIN": "${{ vars.BIJUX_DOCS_RUST_TOOLCHAIN }}"
          "VARS_DOCS_SETUP_PYTHON": "${{ vars.BIJUX_DOCS_SETUP_PYTHON }}"
          "VARS_DOCS_SETUP_UV": "${{ vars.BIJUX_DOCS_SETUP_UV }}"
          "VARS_DOCS_SETUP_NODE": "${{ vars.BIJUX_DOCS_SETUP_NODE }}"
          "VARS_DOCS_SETUP_RUST": "${{ vars.BIJUX_DOCS_SETUP_RUST }}"
        "run": "set -euo pipefail\n\nif [[ -f \".github/docs-deploy.env\" ]]; then\n  # shellcheck disable=SC1091\n  source \".github/docs-deploy.env\"\nfi\n\nnon_empty() {\n  local value=\"$1\"\n  [[ -n \"${value// }\" ]]\n}\n\nfrom_vars_or_default() {\n  local var_value=\"$1\"\n  local env_value=\"$2\"\n  local default_value=\"$3\"\n  if non_empty \"$env_value\"; then\n    printf '%s\\n' \"$env_value\"\n    return\n  fi\n  if non_empty \"$var_value\"; then\n    printf '%s\\n' \"$var_value\"\n    return\n  fi\n  printf '%s\\n' \"$default_value\"\n}\n\nhas_target() {\n  local target=\"$1\"\n  make -prRn 2>/dev/null | awk -F':' -v t=\"$target\" '$1 == t { found=1 } END { exit(found ? 0 : 1) }'\n}\n\ndiscover_command() {\n  local explicit=\"$1\"\n  shift\n  if non_empty \"$explicit\"; then\n    printf '%s\\n' \"$explicit\"\n    return\n  fi\n  for candidate in \"$@\"; do\n    if has_target \"$candidate\"; then\n      printf 'make %s\\n' \"$candidate\"\n      return\n    fi\n  done\n  printf '%s\\n' \"\"\n}\n\nrepository_name=\"${GITHUB_REPOSITORY#*/}\"\nif [[ \"$repository_name\" == \"bijux.github.io\" ]]; then\n  default_site_url=\"https://bijux.io/\"\nelse\n  default_site_url=\"https://bijux.io/${repository_name}/\"\nfi\n\nsite_url=\"$(from_vars_or_default \"$VARS_DOCS_SITE_URL\" \"${BIJUX_DOCS_SITE_URL:-}\" \"$default_site_url\")\"\nsite_dir=\"$(from_vars_or_default \"$VARS_DOCS_SITE_DIR\" \"${BIJUX_DOCS_SITE_DIR:-}\" \"artifacts/docs/site\")\"\n\ninstall_command=\"$(discover_command \"$(from_vars_or_default \"$VARS_DOCS_INSTALL_COMMAND\" \"${BIJUX_DOCS_INSTALL_COMMAND:-}\" \"\")\" gh-docs-install docs-install install)\"\nbuild_command=\"$(discover_command \"$(from_vars_or_default \"$VARS_DOCS_BUILD_COMMAND\" \"${BIJUX_DOCS_BUILD_COMMAND:-}\" \"\")\" gh-docs-build docs-check docs series-docs-build)\"\nverify_command=\"$(discover_command \"$(from_vars_or_default \"$VARS_DOCS_VERIFY_COMMAND\" \"${BIJUX_DOCS_VERIFY_COMMAND:-}\" \"\")\" gh-docs-verify docs-verify)\"\n\npython_version=\"$(from_vars_or_default \"$VARS_DOCS_PYTHON_VERSION\" \"${BIJUX_DOCS_PYTHON_VERSION:-}\" \"3.11.17\")\"\nnode_version=\"$(from_vars_or_default \"$VARS_DOCS_NODE_VERSION\" \"${BIJUX_DOCS_NODE_VERSION:-}\" \"22\")\"\nrust_toolchain=\"$(from_vars_or_default \"$VARS_DOCS_RUST_TOOLCHAIN\" \"${BIJUX_DOCS_RUST_TOOLCHAIN:-}\" \"stable\")\"\n\nsetup_python=\"$(from_vars_or_default \"$VARS_DOCS_SETUP_PYTHON\" \"${BIJUX_DOCS_SETUP_PYTHON:-}\" \"\")\"\nsetup_uv=\"$(from_vars_or_default \"$VARS_DOCS_SETUP_UV\" \"${BIJUX_DOCS_SETUP_UV:-}\" \"\")\"\nsetup_node=\"$(from_vars_or_default \"$VARS_DOCS_SETUP_NODE\" \"${BIJUX_DOCS_SETUP_NODE:-}\" \"\")\"\nsetup_rust=\"$(from_vars_or_default \"$VARS_DOCS_SETUP_RUST\" \"${BIJUX_DOCS_SETUP_RUST:-}\" \"\")\"\n\nif ! non_empty \"$setup_python\"; then\n  if [[ -f \"pyproject.toml\" || -f \"mkdocs.yml\" || -f \"mkdocs.shared.yml\" ]]; then\n    setup_python=\"true\"\n  else\n    setup_python=\"false\"\n  fi\nfi\n\nif ! non_empty \"$setup_uv\"; then\n  [[ -f \"uv.lock\" ]] && setup_uv=\"true\" || setup_uv=\"false\"\nfi\n\nif ! non_empty \"$setup_node\"; then\n  if [[ -f \"package-lock.json\" || -f \"package.json\" || -f \"configs/sources/repository/docs/package-lock.json\" ]]; then\n    setup_node=\"true\"\n  else\n    setup_node=\"false\"\n  fi\nfi\n\nif ! non_empty \"$setup_rust\"; then\n  if [[ -f \"Cargo.toml\" || -f \"rust-toolchain.toml\" || -f \"rust-toolchain\" ]]; then\n    setup_rust=\"true\"\n  else\n    setup_rust=\"false\"\n  fi\nfi\n\nif ! non_empty \"$build_command\"; then\n  echo \"Unable to discover a docs build command. Set BIJUX_DOCS_BUILD_COMMAND.\" >&2\n  exit 1\nfi\n\n\ntest -n \"${verify_command// }\" || { echo \"verification command: required before publication\" >&2; exit 1; }\nfor value in \"$site_url\" \"$site_dir\" \"$install_command\" \"$build_command\" \"$verify_command\" \"$python_version\" \"$node_version\" \"$rust_toolchain\" \"$setup_python\" \"$setup_uv\" \"$setup_node\" \"$setup_rust\"; do\n  [[ \"$value\" != *$'\\n'* && \"$value\" != *$'\\r'* ]] || { echo \"Control characters forbidden in deploy configuration\" >&2; exit 1; }\ndone\n[[ \"$site_dir\" =~ ^artifacts/[A-Za-z0-9._/-]+$ && \"$site_dir\" != *'/../'* && \"$site_dir\" != */.. && \"$site_dir\" != *'//'* ]] || exit 1\ntest \"$site_url\" = \"$default_site_url\" || { echo \"Site URL must match repository production identity\" >&2; exit 1; }\n\n{\n  echo \"site_url=${site_url}\"\n  echo \"site_dir=${site_dir}\"\n  echo \"install_command=${install_command}\"\n  echo \"build_command=${build_command}\"\n  echo \"verify_command=${verify_command}\"\n  echo \"python_version=${python_version}\"\n  echo \"node_version=${node_version}\"\n  echo \"rust_toolchain=${rust_toolchain}\"\n  echo \"setup_python=${setup_python}\"\n  echo \"setup_uv=${setup_uv}\"\n  echo \"setup_node=${setup_node}\"\n  echo \"setup_rust=${setup_rust}\"\n} >> \"$GITHUB_OUTPUT\"\n"
      - "name": "Setup Python"
        "if": "${{ steps.config.outputs.setup_python == 'true' }}"
        "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
