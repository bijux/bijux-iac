"name": "repository policy"
"on":
  "pull_request":
    "branches":
      - "main"
  "merge_group":
    "branches":
      - "main"
"permissions":
  "contents": "read"
  "actions": "read"
  "pull-requests": "read"
"jobs":
  "policy":
    "name": "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}policy / github"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 10
    "steps":
      - "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        "with":
          "fetch-depth": 0
      - "name": "Gather changed files"
        "shell": "bash"
        "env":
          "PR_BASE_SHA": "${{ github.event.pull_request.base.sha }}"
          "PR_HEAD_SHA": "${{ github.event.pull_request.head.sha }}"
        "run": "set -euo pipefail\nwrite_single_commit_diff() {\n  git diff-tree --no-commit-id --name-only -r \"${GITHUB_SHA}\" > /tmp/changed-files.txt\n}\nwrite_range_diff_or_fallback() {\n  local base_sha=\"$1\"\n  local head_sha=\"$2\"\n  if [[ -z \"${base_sha}\" || -z \"${head_sha}\" ]]; then\n    write_single_commit_diff\n    return 0\n  fi\n  if ! git cat-file -e \"${base_sha}^{commit}\" 2>/dev/null; then\n    write_single_commit_diff\n    return 0\n  fi\n  if ! git cat-file -e \"${head_sha}^{commit}\" 2>/dev/null; then\n    write_single_commit_diff\n    return 0\n  fi\n  if git merge-base --is-ancestor \"${base_sha}\" \"${head_sha}\" 2>/dev/null; then\n    git diff --name-only \"${base_sha}...${head_sha}\" > /tmp/changed-files.txt\n  else\n    write_single_commit_diff\n  fi\n}\nif [[ \"${{ github.event_name }}\" == \"pull_request\" ]]; then\n  for commit_sha in \"${PR_BASE_SHA}\" \"${PR_HEAD_SHA}\"; do\n    if [[ ! \"${commit_sha}\" =~ ^[0-9a-f]{40}$ ]]; then\n      echo \"ERROR: pull request event requires full base and head commit SHAs\" >&2\n      exit 1\n    fi\n    if [[ \"$(git cat-file -t \"${commit_sha}\" 2>/dev/null)\" != commit ]]; then\n      echo \"ERROR: pull request event commit is absent from checkout: ${commit_sha}\" >&2\n      exit 1\n    fi\n  done\n  if [[ \"$(git rev-parse --is-shallow-repository)\" != false ]]; then\n    echo \"ERROR: pull request policy requires complete checkout history\" >&2\n    exit 1\n  fi\n  if ! git merge-base \"${PR_BASE_SHA}\" \"${PR_HEAD_SHA}\" >/dev/null; then\n    echo \"ERROR: pull request event commits have no common ancestor\" >&2\n    exit 1\n  fi\n  git diff --name-only \"${PR_BASE_SHA}...${PR_HEAD_SHA}\" > /tmp/changed-files.txt\nelif [[ \"${{ github.event_name }}\" == \"merge_group\" ]]; then\n  base_sha=\"${{ github.event.merge_group.base_sha }}\"\n  head_sha=\"${{ github.event.merge_group.head_sha }}\"\n  if [[ -n \"${base_sha}\" && \"${base_sha}\" != \"null\" && -n \"${head_sha}\" && \"${head_sha}\" != \"null\" ]]; then\n    write_range_diff_or_fallback \"${base_sha}\" \"${head_sha}\"\n  else\n    write_single_commit_diff\n  fi\nelse\n  before_sha=\"${{ github.event.before }}\"\n  if [[ -n \"${before_sha}\" && \"${before_sha}\" != \"0000000000000000000000000000000000000000\" ]]; then\n    write_range_diff_or_fallback \"${before_sha}\" \"${GITHUB_SHA}\"\n  else\n    write_single_commit_diff\n  fi\nfi\n"
      - "name": "Enforce protected .github change policy"
        "if": "${{ github.event_name == 'pull_request' }}"
        "shell": "bash"
        "run": "set -euo pipefail\npython3 .github/scripts/check_protected_github_changes.py --changed-file-list /tmp/changed-files.txt\n"
      - "name": "Select canonical workflow verification source"
        "id": "workflow_source"
        "shell": "bash"
        "run": "set -euo pipefail\nrepo_name=\"${GITHUB_REPOSITORY#*/}\"\ncandidate_args=()\nif [[ \"${GITHUB_REPOSITORY}\" == 'bijux/bijux-std' ]]; then\n  source_root=\"${PWD}\"\n  source_sha=\"${GITHUB_SHA}\"\n  candidate_args=(--candidate)\nelse\n  source_sha=\"$(cat .github/standards/bijux-std.sha)\"\n  [[ \"${source_sha}\" =~ ^[0-9a-f]{40}$ ]] || { echo 'ERROR: full standard source pin required' >&2; exit 1; }\n  mkdir -p artifacts\n  [[ ! -L artifacts ]] || { echo 'ERROR: artifacts must be owned by this checkout' >&2; exit 1; }\n  source_root=\"$(mktemp -d \"${PWD}/artifacts/workflow-source.XXXXXXXX\")\"\n  git -C \"${source_root}\" init --quiet\n  git -C \"${source_root}\" remote add origin https://github.com/bijux/bijux-std.git\n  git -C \"${source_root}\" fetch --quiet --depth 1 origin \"${source_sha}\"\n  [[ \"$(git -C \"${source_root}\" rev-parse 'FETCH_HEAD^{commit}')\" == \"${source_sha}\" ]]\n  git -C \"${source_root}\" checkout --quiet --detach \"${source_sha}\"\nfi\nrequires_parser=\"$(python3 \"${source_root}/.github/scripts/check_workflow_projection.py\" \\\n  --target \"${PWD}\" --repo \"${repo_name}\" --source-sha \"${source_sha}\" \\\n  \"${candidate_args[@]}\" --requires-parser)\"\n[[ \"${requires_parser}\" == true || \"${requires_parser}\" == false ]]\nprintf 'requires_parser=%s\\n' \"${requires_parser}\" >> \"${GITHUB_OUTPUT}\"\nprintf 'BIJUX_WORKFLOW_SOURCE_ROOT=%s\\n' \"${source_root}\" >> \"${GITHUB_ENV}\"\nprintf 'BIJUX_WORKFLOW_SOURCE_SHA=%s\\n' \"${source_sha}\" >> \"${GITHUB_ENV}\"\n"
      - "name": "Provision selected workflow parser"
        "uses": "ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83"
        "with":
          "ruby-version": "3.3.12"
      - "name": "Admit selected workflow parser runtime"
        "shell": "bash"
        "run": "set -euo pipefail\nruby -ryaml -rjson -e 'abort \"Ruby 3.3.12 required\" unless RUBY_VERSION == \"3.3.12\"; abort \"Psych structural parser required\" unless YAML.respond_to?(:parse_stream) && YAML.respond_to?(:safe_load); puts JSON.generate({ruby: RUBY_VERSION, psych: Psych::VERSION})'\n"
      - "name": "Verify canonical managed workflow projection"
        "shell": "bash"
        "run": "set -euo pipefail\ncandidate_args=()\nif [[ \"${GITHUB_REPOSITORY}\" == 'bijux/bijux-std' ]]; then\n  candidate_args=(--candidate)\nfi\npython3 \"${BIJUX_WORKFLOW_SOURCE_ROOT}/.github/scripts/check_workflow_projection.py\" \\\n  --target \"${PWD}\" --repo \"${GITHUB_REPOSITORY#*/}\" \\\n  --source-sha \"${BIJUX_WORKFLOW_SOURCE_SHA}\" \"${candidate_args[@]}\"\n"
      - "name": "Render generated .github files from manifest"
        "shell": "bash"
        "run": "set -euo pipefail\nrepo_name=\"${GITHUB_REPOSITORY#*/}\"\npython3 .github/scripts/render_repo_configs.py --repo \"${repo_name}\"\n"
      - "name": "Ensure generated files are committed"
        "shell": "bash"
        "run": "set -euo pipefail\nif [[ -n \"$(git status --short -- .github/release.env .github/dependabot.yml .github/labeler.yml .github/codecov.yml .github/workflows/ci.yml .github/workflows/verify.yml .github/standards/bijux-std.sha)\" ]]; then\n  git status --short -- .github/release.env .github/dependabot.yml .github/labeler.yml .github/codecov.yml .github/workflows/ci.yml .github/workflows/verify.yml .github/standards/bijux-std.sha\n  exit 1\nfi\n"
