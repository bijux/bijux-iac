      - "name": "Execute assigned browser journeys"
        "shell": "bash"
        "env":
          "PLAYWRIGHT_BROWSERS_PATH": "/ms-playwright"
          "GH_TOKEN": "${{ github.token }}"
          "EXPECTED_WORKFLOW_HEAD": "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}"
        "run": "set -euo pipefail\ngit config --global --add safe.directory \"$GITHUB_WORKSPACE\"\nchown \"$(id -u):$(id -g)\" \"$HOME\"\npython3 tests/bijux-docs/execution/browser_gate.py run \\\n  --group '${{ matrix.group }}' --engine '${{ matrix.engine }}'\n"
