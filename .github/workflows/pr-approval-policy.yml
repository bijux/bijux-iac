"name": "pull request approval"
"on":
  "pull_request_target":
    "branches":
      - "main"
    "types":
      - "opened"
      - "reopened"
      - "synchronize"
      - "edited"
      - "labeled"
      - "unlabeled"
      - "ready_for_review"
      - "converted_to_draft"
  "pull_request_review":
    "types":
      - "submitted"
      - "dismissed"
"permissions":
  "contents": "read"
  "pull-requests": "read"
"jobs":
  "pr-approval":
    "name": "${{ (github.event.pull_request.user.login == 'dependabot[bot]' || (github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.ref == 'automation/dependency-lock-refresh')) && 'unverified dependency / ' || '' }}policy / pr approval"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 10
    "steps":
      - "name": "Enforce owner approval policy"
        "env":
          "GH_TOKEN": "${{ github.token }}"
          "GH_REPOSITORY": "${{ github.repository }}"
          "GH_EVENT_NAME": "${{ github.event_name }}"
          "GH_EVENT_PATH": "${{ github.event_path }}"
          "OWNER_LOGIN": "bijux"
          "OWNER_SELF_SIGNOFF_LABEL": "owner-self-signoff"
        "shell": "bash"
        "run": "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport os\nimport sys\nimport urllib.request\n\nrepo = os.environ[\"GH_REPOSITORY\"]\ntoken = os.environ[\"GH_TOKEN\"]\nevent_name = os.environ[\"GH_EVENT_NAME\"]\nevent_path = (\n  os.environ.get(\"GH_EVENT_PATH\")\n  or os.environ.get(\"GITHUB_EVENT_PATH\")\n)\nif not event_path:\n  print(\n    \"Missing GitHub event payload path. \"\n    \"Expected GH_EVENT_PATH or GITHUB_EVENT_PATH.\"\n  )\n  raise SystemExit(1)\nowner_login = os.environ[\"OWNER_LOGIN\"]\nowner_self_signoff_label = os.environ[\"OWNER_SELF_SIGNOFF_LABEL\"]\n\nwith open(event_path, encoding=\"utf-8\") as fh:\n  event = json.load(fh)\n\npr = event.get(\"pull_request\")\nif not isinstance(pr, dict):\n  print(\"No pull request payload found; skipping.\")\n  raise SystemExit(0)\n\nnumber = pr[\"number\"]\nauthor = pr[\"user\"][\"login\"]\n\ndef api_get(path: str):\n  request = urllib.request.Request(\n    f\"https://api.github.com/repos/{repo}{path}\",\n    headers={\n      \"Accept\": \"application/vnd.github+json\",\n      \"Authorization\": f\"Bearer {token}\",\n      \"X-GitHub-Api-Version\": \"2022-11-28\",\n    },\n  )\n  with urllib.request.urlopen(request) as response:\n    return json.load(response)\n\npr_fresh = api_get(f\"/pulls/{number}\")\nlabels = {label[\"name\"] for label in pr_fresh.get(\"labels\", [])}\n\nif author == owner_login:\n  if owner_self_signoff_label not in labels:\n    print(\n      f\"Owner-authored PR requires label '{owner_self_signoff_label}'. \"\n      f\"Add the label to confirm explicit self-signoff.\"\n    )\n    raise SystemExit(1)\n  print(\n    f\"Owner-authored PR has required self-signoff label: \"\n    f\"{owner_self_signoff_label}\"\n  )\n  raise SystemExit(0)\n\nreviews = api_get(f\"/pulls/{number}/reviews\")\nlatest_state_by_user: dict[str, str] = {}\nfor review in reviews:\n  user = review.get(\"user\") or {}\n  login = user.get(\"login\")\n  state = review.get(\"state\")\n  if not login or not state:\n    continue\n  latest_state_by_user[login] = state\n\nowner_state = latest_state_by_user.get(owner_login)\nif owner_state != \"APPROVED\":\n  print(\n    f\"Non-owner PR requires an APPROVED review from '{owner_login}'. \"\n    f\"Current latest state: {owner_state or 'none'}.\"\n  )\n  raise SystemExit(1)\n\nprint(f\"Non-owner PR has required APPROVED review from {owner_login}.\")\nPY\n"
    "if": "${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review') || (github.event.pull_request.user.login != 'dependabot[bot]' && (github.event.pull_request.user.login != 'github-actions[bot]' || github.event.pull_request.head.ref != 'automation/dependency-lock-refresh')) }}"
