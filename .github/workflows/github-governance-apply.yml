name: github-governance-apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify credentials, retain a read-only preflight, or explicitly apply its bound plan
        type: choice
        default: preflight
        required: true
        options: [verify-credential, preflight, apply]

      ruleset_transport:
        description: Retain complete API protections or require full locked-provider representation
        type: choice
        default: github-api
        required: true
        options: [github-api, terraform]

permissions:
  contents: read

concurrency:
  group: github-governance-apply-main
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unaccepted application refs before entering the credential environment
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_REPOSITORY: ${{ github.repository }}
          APPLY_EVENT: ${{ github.event_name }}
          APPLY_REF: ${{ github.ref }}
          APPLY_SHA: ${{ github.sha }}
          APPLY_OPERATION: ${{ inputs.operation }}
          APPLY_TRANSPORT: ${{ inputs.ruleset_transport }}
        run: |
          set -euo pipefail
          [[ "$APPLY_REPOSITORY" == "bijux/bijux-iac" ]] || exit 1
          [[ "$APPLY_EVENT" == "workflow_dispatch" ]] || exit 1
          [[ "$APPLY_REF" == "refs/heads/main" ]] || exit 1
          case "$APPLY_OPERATION" in
            verify-credential|preflight|apply) ;;
            *) exit 1 ;;
          esac
          case "$APPLY_TRANSPORT" in
            github-api|terraform) ;;
            *) exit 1 ;;
          esac
          accepted_sha="$(gh api repos/bijux/bijux-iac/commits/main --jq .sha)"
          [[ "$accepted_sha" == "$APPLY_SHA" ]] || exit 1

  execution:
    name: iac / governance operation
    needs: admission
    environment: governance-apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GOVERNANCE_TOKEN }}
      TF_VAR_github_token: ${{ secrets.GOVERNANCE_TOKEN }}
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/artifacts/python/pycache
    steps:
      - name: Require the protected environment credential
        run: test -n "$GH_TOKEN"
      - name: Checkout accepted input commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify protected credential access without writes
        if: ${{ inputs.operation == 'verify-credential' }}
        run: python3 -m scripts.execution.application verify-credential
      - name: Setup Terraform
        if: ${{ inputs.operation != 'verify-credential' && inputs.ruleset_transport == 'terraform' }}
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Complete accepted-main preflight before the first write
        if: ${{ inputs.operation != 'verify-credential' }}
        env:
          RULESET_TRANSPORT: ${{ inputs.ruleset_transport }}
        run: python3 -m scripts.execution.application preflight --transport "$RULESET_TRANSPORT"
      - name: Apply the bound settings and saved ruleset plan, then audit the family
        if: ${{ inputs.operation == 'apply' }}
        run: python3 -m scripts.execution.application apply
      - name: Retain application receipt and partial-operation ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-application-receipt
          path: |
            artifacts/governance/receipt.json
            artifacts/governance/producers.json
          if-no-files-found: error
