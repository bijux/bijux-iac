{
  "workflow": {
    "rules": [
      {
        "if": "$CI_SERVER_URL != \"https://gitlab.com\" || $CI_PROJECT_ID != \"88948041\" || $CI_PROJECT_PATH != \"bijux-oss/bijux-std\"",
        "when": "never"
      },
      {
        "if": "$CI_PIPELINE_SOURCE == \"merge_request_event\""
      },
      {
        "if": "$CI_PIPELINE_SOURCE == \"push\" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS",
        "when": "never"
      },
      {
        "if": "$CI_PIPELINE_SOURCE == \"push\" && $CI_COMMIT_BRANCH"
      },
      {
        "if": "$CI_PIPELINE_SOURCE == \"push\" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == \"true\""
      },
      {
        "if": "$CI_PIPELINE_SOURCE == \"web\" || $CI_PIPELINE_SOURCE == \"schedule\""
      },
      {
        "when": "never"
      }
    ]
  },
  "stages": [
    "planning",
    "validation",
    "fixtures",
    "browsers",
    "qualification",
    "acceptance",
    "publication"
  ],
  "variables": {
    "GIT_DEPTH": "0",
    "PYTHONDONTWRITEBYTECODE": "1",
    "VERIFICATION_MODE": "full",
    "EXPECTED_FRONTEND": "true",
    "FF_SCRIPT_SECTIONS": "true"
  },
  "default": {
    "tags": [
      "saas-linux-medium-amd64"
    ],
    "interruptible": true
  },
  "std / input plan": {
    "stage": "planning",
    "image": "registry.gitlab.com/bijux-oss/bijux-std/ci-runtime@sha256:33fdff28a20a70fda96b0171e6cc3c03400bcfb2041b515cac106acf9eeca34a",
    "timeout": "20 minutes",
    "before_script": [],
    "script": [
      "python3 -B shared/bijux-gitlab/execute.py --job 'std / input plan'"
    ],
    "artifacts": {
      "when": "always",
      "expire_in": "14 days",
      "paths": [
        "artifacts/bijux-docs/input-plan",
        "artifacts/gitlab/jobs/$CI_JOB_ID/"
      ]
    },
    "dependencies": []
  },
  "std / standard": {
    "stage": "validation",
    "image": "ruby:3.3.12-bookworm",
    "timeout": "20 minutes",
    "before_script": [
      "apt-get update && apt-get install --yes --no-install-recommends python3 python3-venv python3-yaml git make curl ca-certificates perl shellcheck xz-utils jq"
